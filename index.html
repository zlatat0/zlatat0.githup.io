<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗿 Ancient Ruins Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Georgia', serif; }
canvas { display: block; }

#ui {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}

#score-panel {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 30px; align-items: center;
}

.stat-box {
  background: linear-gradient(180deg, rgba(30,20,10,0.85), rgba(15,10,5,0.9));
  border: 2px solid #8B6914;
  border-radius: 8px;
  padding: 8px 20px;
  color: #FFD700;
  font-size: 22px;
  text-shadow: 0 0 10px rgba(255,215,0,0.5);
  letter-spacing: 2px;
  box-shadow: 0 0 15px rgba(139,105,20,0.3), inset 0 0 10px rgba(0,0,0,0.5);
}

.stat-box span { color: #fff; font-weight: bold; }

#start-screen, #gameover-screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, rgba(20,35,15,0.9) 0%, rgba(5,10,3,0.97) 100%);
  pointer-events: all;
  transition: opacity 0.5s;
}

#gameover-screen { display: none; }

.title {
  font-size: 64px; color: #FFD700;
  text-shadow: 0 0 30px rgba(255,215,0,0.6), 0 4px 8px rgba(0,0,0,0.8);
  margin-bottom: 10px; letter-spacing: 6px;
}

.subtitle {
  font-size: 20px; color: #7CFC00;
  text-shadow: 0 0 15px rgba(124,252,0,0.4);
  margin-bottom: 40px; letter-spacing: 4px;
}

.btn {
  pointer-events: all; cursor: pointer;
  background: linear-gradient(180deg, #8B6914, #5C4A0E);
  border: 2px solid #FFD700;
  color: #FFD700; font-family: 'Georgia', serif;
  font-size: 24px; padding: 15px 50px;
  border-radius: 8px; letter-spacing: 3px;
  text-shadow: 0 0 10px rgba(255,215,0,0.5);
  box-shadow: 0 0 20px rgba(139,105,20,0.4);
  transition: all 0.3s;
}

.btn:hover {
  background: linear-gradient(180deg, #A67C1A, #8B6914);
  box-shadow: 0 0 30px rgba(255,215,0,0.6);
  transform: scale(1.05);
}

.controls-info {
  margin-top: 30px; color: #aaa; font-size: 14px;
  text-align: center; line-height: 2;
}

.controls-info kbd {
  background: rgba(255,255,255,0.1); border: 1px solid #555;
  border-radius: 4px; padding: 2px 8px; color: #ddd;
}

#final-score { font-size: 48px; color: #FFD700; margin: 20px 0; }
#final-coins { font-size: 28px; color: #FFA500; margin-bottom: 30px; }

.rune-decoration {
  font-size: 30px; color: #2ecc71;
  text-shadow: 0 0 20px rgba(46,204,113,0.8);
  margin: 10px 0;
  letter-spacing: 15px;
}

#mobile-controls {
  position: fixed; bottom: 20px; left: 0; width: 100%;
  display: none; justify-content: center; gap: 15px;
  pointer-events: all; z-index: 20;
}

.mobile-btn {
  width: 70px; height: 70px; border-radius: 50%;
  background: rgba(139,105,20,0.6); border: 2px solid #FFD700;
  color: #FFD700; font-size: 28px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; user-select: none;
  -webkit-tap-highlight-color: transparent;
}

@media (pointer: coarse) {
  #mobile-controls { display: flex; }
}
</style>
</head>
<body>

<div id="ui">
  <div id="score-panel">
    <div class="stat-box">🏛 <span id="score">0</span></div>
    <div class="stat-box">🪙 <span id="coins">0</span></div>
    <div class="stat-box">⚡ <span id="speed">1.0</span>x</div>
  </div>

  <div id="start-screen">
    <div class="rune-decoration">᚛ ᚜ ᚐ ᚑ ᚒ ᚓ ᚔ ᚛ ᚜</div>
    <div class="title">🗿 ANCIENT RUINS</div>
    <div class="subtitle">— Бег сквозь Забытые Джунгли —</div>
    <button class="btn" onclick="startGame()">НАЧАТЬ ПУТЬ</button>
    <div class="controls-info">
      <kbd>←</kbd> <kbd>→</kbd> или <kbd>A</kbd> <kbd>D</kbd> — смена полосы<br>
      <kbd>↑</kbd> или <kbd>W</kbd> или <kbd>Space</kbd> — прыжок<br>
      Свайпы на мобильных
    </div>
    <div class="rune-decoration">᚛ ᚜ ᚐ ᚑ ᚒ ᚓ ᚔ ᚛ ᚜</div>
  </div>

  <div id="gameover-screen">
    <div class="rune-decoration">᚛ ᚜ ᚐ ᚑ ᚒ ᚛ ᚜</div>
    <div class="title" style="font-size:48px;">💀 РУИНЫ ПОГЛОТИЛИ ТЕБЯ</div>
    <div id="final-score">0</div>
    <div id="final-coins">🪙 0</div>
    <button class="btn" onclick="restartGame()">ПОПРОБОВАТЬ СНОВА</button>
    <div class="rune-decoration">᚛ ᚜ ᚐ ᚑ ᚒ ᚛ ᚜</div>
  </div>
</div>

<div id="mobile-controls">
  <div class="mobile-btn" ontouchstart="moveLeft()">◀</div>
  <div class="mobile-btn" ontouchstart="jump()">▲</div>
  <div class="mobile-btn" ontouchstart="moveRight()">▶</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==================== GAME CONFIG ====================
const CONFIG = {
  lanes: [-3, 0, 3],
  roadWidth: 10,
  segmentLength: 20,
  visibleSegments: 12,
  baseSpeed: 0.35,
  speedIncrement: 0.00008,
  jumpForce: 0.32,
  gravity: 0.012,
  coinValue: 10,
  fogColor: 0x2d4a22,
  fogNear: 30,
  fogFar: 140,
};

// ==================== GLOBALS ====================
let scene, camera, renderer, clock;
let player, playerLane = 1, targetX = 0;
let isJumping = false, jumpVelocity = 0;
let gameSpeed = CONFIG.baseSpeed;
let score = 0, coinCount = 0;
let gameRunning = false, gameOver = false;
let roadSegments = [], obstacles = [], coins = [], decorations = [];
let particles = [];
let torches = [];
let frameCount = 0;

// ==================== INIT ====================
function init() {
  clock = new THREE.Clock();

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(CONFIG.fogColor);
  scene.fog = new THREE.Fog(CONFIG.fogColor, CONFIG.fogNear, CONFIG.fogFar);

  // Camera
  camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 6, 10);
  camera.lookAt(0, 1.5, -10);

  setupLighting();
  createPlayer();
  generateInitialWorld();
  setupControls();

  window.addEventListener('resize', onResize);
  animate();
}

// ==================== LIGHTING ====================
function setupLighting() {
  // Hemisphere light (sky/ground)
  const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x2d4a22, 0.5);
  scene.add(hemiLight);

  // Ambient fill
  const ambientLight = new THREE.AmbientLight(0x404030, 0.4);
  scene.add(ambientLight);

  // Main directional (sun)
  const sunLight = new THREE.DirectionalLight(0xFFD080, 1.4);
  sunLight.position.set(15, 25, 10);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 0.5;
  sunLight.shadow.camera.far = 80;
  sunLight.shadow.camera.left = -25;
  sunLight.shadow.camera.right = 25;
  sunLight.shadow.camera.top = 25;
  sunLight.shadow.camera.bottom = -25;
  sunLight.shadow.bias = -0.001;
  scene.add(sunLight);

  // Secondary warm fill
  const fillLight = new THREE.DirectionalLight(0xFFA040, 0.3);
  fillLight.position.set(-10, 10, -5);
  scene.add(fillLight);
}

// ==================== MATERIALS ====================
function createStoneMaterial(color = 0x8B7D6B) {
  return new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.85,
    metalness: 0.05,
  });
}

function createMossMaterial() {
  return new THREE.MeshStandardMaterial({
    color: 0x2ecc71,
    emissive: 0x1a8a4a,
    emissiveIntensity: 0.6,
    roughness: 0.7,
  });
}

function createRuneMaterial(color = 0x2ecc71) {
  return new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: 1.2,
    roughness: 0.3,
    metalness: 0.2,
  });
}

function createGoldMaterial() {
  return new THREE.MeshStandardMaterial({
    color: 0xFFD700,
    emissive: 0xFF8C00,
    emissiveIntensity: 0.4,
    roughness: 0.2,
    metalness: 0.9,
  });
}

// ==================== PLAYER ====================
function createPlayer() {
  player = new THREE.Group();

  // Body
  const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.6);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x8B4513, roughness: 0.6, metalness: 0.1
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.2;
  body.castShadow = true;
  player.add(body);

  // Head
  const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
  const headMat = new THREE.MeshStandardMaterial({
    color: 0xD2691E, roughness: 0.5
  });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 2.1;
  head.castShadow = true;
  player.add(head);

  // Hat (explorer)
  const hatGeo = new THREE.CylinderGeometry(0.5, 0.55, 0.2, 8);
  const hatMat = new THREE.MeshStandardMaterial({ color: 0x654321, roughness: 0.7 });
  const hat = new THREE.Mesh(hatGeo, hatMat);
  hat.position.y = 2.5;
  hat.castShadow = true;
  player.add(hat);

  const hatBrimGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.05, 8);
  const hatBrim = new THREE.Mesh(hatBrimGeo, hatMat);
  hatBrim.position.y = 2.4;
  player.add(hatBrim);

  // Legs
  for (let side of [-0.2, 0.2]) {
    const legGeo = new THREE.BoxGeometry(0.3, 0.7, 0.35);
    const leg = new THREE.Mesh(legGeo, bodyMat);
    leg.position.set(side, 0.35, 0);
    leg.castShadow = true;
    player.add(leg);
  }

  // Arms
  for (let side of [-0.55, 0.55]) {
    const armGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
    const arm = new THREE.Mesh(armGeo, bodyMat);
    arm.position.set(side, 1.2, 0);
    arm.castShadow = true;
    player.add(arm);
  }

  player.position.set(CONFIG.lanes[1], 0, 0);
  scene.add(player);
}

// ==================== ROAD GENERATION ====================
function createRoadSegment(zPos) {
  const group = new THREE.Group();
  group.position.z = zPos;

  // Main road surface
  const roadGeo = new THREE.PlaneGeometry(CONFIG.roadWidth, CONFIG.segmentLength, 10, 20);
  const roadMat = new THREE.MeshStandardMaterial({
    color: 0x9B8B6E,
    roughness: 0.9,
    metalness: 0.02,
  });

  // Add vertex displacement for tile effect
  const pos = roadGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setZ(i, pos.getZ(i) + (Math.random() - 0.5) * 0.03);
  }
  roadGeo.computeVertexNormals();

  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.01;
  road.receiveShadow = true;
  group.add(road);

  // Tile grid lines
  const tileLineMat = new THREE.MeshStandardMaterial({
    color: 0x6B5B4E, roughness: 0.95
  });
  for (let x = -4; x <= 4; x += 2) {
    const lineGeo = new THREE.BoxGeometry(0.05, 0.02, CONFIG.segmentLength);
    const line = new THREE.Mesh(lineGeo, tileLineMat);
    line.position.set(x, 0.02, 0);
    group.add(line);
  }
  for (let z = -CONFIG.segmentLength/2; z <= CONFIG.segmentLength/2; z += 2) {
    const lineGeo = new THREE.BoxGeometry(CONFIG.roadWidth, 0.02, 0.05);
    const line = new THREE.Mesh(lineGeo, tileLineMat);
    line.position.set(0, 0.02, z);
    group.add(line);
  }

  // Moss cracks between lanes
  const mossMat = createMossMaterial();
  for (let lx of [-1.5, 1.5]) {
    for (let z = -CONFIG.segmentLength/2; z < CONFIG.segmentLength/2; z += 0.8) {
      if (Math.random() > 0.3) {
        const mossGeo = new THREE.BoxGeometry(0.15 + Math.random() * 0.2, 0.03, 0.4 + Math.random() * 0.5);
        const moss = new THREE.Mesh(mossGeo, mossMat);
        moss.position.set(lx + (Math.random() - 0.5) * 0.3, 0.03, z);
        moss.rotation.y = (Math.random() - 0.5) * 0.3;
        group.add(moss);
      }
    }
  }

  // Edge stones
  const edgeMat = createStoneMaterial(0x7A6B5A);
  for (let side of [-1, 1]) {
    for (let z = -CONFIG.segmentLength/2; z < CONFIG.segmentLength/2; z += 2 + Math.random() * 2) {
      const w = 0.8 + Math.random() * 1.2;
      const h = 0.3 + Math.random() * 0.8;
      const d = 0.8 + Math.random() * 1;
      const edgeGeo = new THREE.BoxGeometry(w, h, d);
      const edge = new THREE.Mesh(edgeGeo, edgeMat);
      edge.position.set(side * (CONFIG.roadWidth/2 + w/2 + 0.2), h/2, z);
      edge.rotation.y = Math.random() * 0.3;
      edge.castShadow = true;
      edge.receiveShadow = true;
      group.add(edge);
    }
  }

  // Ground plane (jungle floor)
  const groundGeo = new THREE.PlaneGeometry(60, CONFIG.segmentLength);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x3A5A2A, roughness: 0.95
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.05;
  ground.receiveShadow = true;
  group.add(ground);

  scene.add(group);
  return group;
}

// ==================== DECORATIONS ====================
function createColumn(x, z, height) {
  const group = new THREE.Group();
  const mat = createStoneMaterial(0x8A7D6A);

  // Base
  const baseGeo = new THREE.BoxGeometry(1.4, 0.5, 1.4);
  const base = new THREE.Mesh(baseGeo, mat);
  base.position.y = 0.25;
  base.castShadow = true;
  base.receiveShadow = true;
  group.add(base);

  // Shaft
  const shaftGeo = new THREE.CylinderGeometry(0.4, 0.5, height, 8);
  const shaft = new THREE.Mesh(shaftGeo, mat);
  shaft.position.y = 0.5 + height/2;
  shaft.castShadow = true;
  group.add(shaft);

  // Capital
  const capGeo = new THREE.BoxGeometry(1.2, 0.4, 1.2);
  const cap = new THREE.Mesh(capGeo, mat);
  cap.position.y = 0.5 + height + 0.2;
  cap.castShadow = true;
  group.add(cap);

  // Runes on column
  if (Math.random() > 0.4) {
    const runeColor = Math.random() > 0.5 ? 0x2ecc71 : 0xFF8C00;
    const runeMat = createRuneMaterial(runeColor);
    for (let i = 0; i < 3; i++) {
      const runeGeo = new THREE.BoxGeometry(0.15, 0.3, 0.05);
      const rune = new THREE.Mesh(runeGeo, runeMat);
      const angle = (i / 3) * Math.PI * 2;
      rune.position.set(
        Math.cos(angle) * 0.45,
        1 + i * (height / 4),
        Math.sin(angle) * 0.45
      );
      rune.lookAt(new THREE.Vector3(0, rune.position.y, 0).add(group.position));
      group.add(rune);
    }
  }

  // Broken top sometimes
  if (Math.random() > 0.5) {
    const brokenGeo = new THREE.ConeGeometry(0.3, 0.6, 5);
    const broken = new THREE.Mesh(brokenGeo, mat);
    broken.position.y = 0.5 + height + 0.6;
    broken.rotation.z = Math.random() * 0.3;
    group.add(broken);
  }

  group.position.set(x, 0, z);
  return group;
}

function createPyramid(x, z, size) {
  const group = new THREE.Group();
  const mat = createStoneMaterial(0x7A6B55);

  const levels = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < levels; i++) {
    const s = size * (1 - i * 0.2);
    const h = size * 0.4;
    const geo = new THREE.BoxGeometry(s, h, s);
    const block = new THREE.Mesh(geo, mat);
    block.position.y = i * h + h/2;
    block.castShadow = true;
    block.receiveShadow = true;
    group.add(block);
  }

  // Glowing rune on top
  const runeColor = Math.random() > 0.5 ? 0x2ecc71 : 0xFF8C00;
  const runeMat = createRuneMaterial(runeColor);
  const runeGeo = new THREE.OctahedronGeometry(0.3, 0);
  const rune = new THREE.Mesh(runeGeo, runeMat);
  rune.position.y = levels * size * 0.4 + 0.5;
  group.add(rune);

  group.position.set(x, 0, z);
  return group;
}

function createStatue(x, z) {
  const group = new THREE.Group();
  const mat = createStoneMaterial(0x6B6055);

  // Pedestal
  const pedGeo = new THREE.BoxGeometry(1.5, 1, 1.5);
  const ped = new THREE.Mesh(pedGeo, mat);
  ped.position.y = 0.5;
  ped.castShadow = true;
  group.add(ped);

  // Body
  const bodyGeo = new THREE.BoxGeometry(0.8, 2.5, 0.6);
  const body = new THREE.Mesh(bodyGeo, mat);
  body.position.y = 2.25;
  body.castShadow = true;
  group.add(body);

  // Head
  const headGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
  const head = new THREE.Mesh(headGeo, mat);
  head.position.y = 3.85;
  head.castShadow = true;
  group.add(head);

  // Eyes (glowing)
  const eyeMat = createRuneMaterial(0xFF4500);
  for (let side of [-0.15, 0.15]) {
    const eyeGeo = new THREE.BoxGeometry(0.12, 0.08, 0.05);
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(side, 3.9, 0.36);
    group.add(eye);
  }

  group.position.set(x, 0, z);
  return group;
}

function createTorch(x, z) {
  const group = new THREE.Group();

  // Pole
  const poleMat = createStoneMaterial(0x5A4A3A);
  const poleGeo = new THREE.CylinderGeometry(0.08, 0.1, 2.5, 6);
  const pole = new THREE.Mesh(poleGeo, poleMat);
  pole.position.y = 1.25;
  pole.castShadow = true;
  group.add(pole);

  // Bowl
  const bowlGeo = new THREE.CylinderGeometry(0.2, 0.12, 0.3, 6);
  const bowl = new THREE.Mesh(bowlGeo, poleMat);
  bowl.position.y = 2.6;
  group.add(bowl);

  // Fire (emissive sphere)
  const fireMat = new THREE.MeshStandardMaterial({
    color: 0xFF6600,
    emissive: 0xFF4400,
    emissiveIntensity: 2.0,
    roughness: 0.3,
    transparent: true,
    opacity: 0.9,
  });
  const fireGeo = new THREE.SphereGeometry(0.18, 6, 6);
  const fire = new THREE.Mesh(fireGeo, fireMat);
  fire.position.y = 2.85;
  fire.userData.isFire = true;
  group.add(fire);

  // Fire glow light
  const fireLight = new THREE.PointLight(0xFF6600, 1.5, 8, 2);
  fireLight.position.y = 2.9;
  fireLight.castShadow = false;
  group.add(fireLight);
  group.userData.fireLight = fireLight;
  group.userData.fireMesh = fire;

  group.position.set(x, 0, z);
  return group;
}

function createVine(x, z, height) {
  const group = new THREE.Group();
  const vineMat = new THREE.MeshStandardMaterial({
    color: 0x228B22, roughness: 0.8
  });

  const segments = 5 + Math.floor(Math.random() * 5);
  for (let i = 0; i < segments; i++) {
    const segGeo = new THREE.BoxGeometry(0.06, height / segments, 0.06);
    const seg = new THREE.Mesh(segGeo, vineMat);
    seg.position.set(
      (Math.random() - 0.5) * 0.2,
      height - i * (height / segments),
      (Math.random() - 0.5) * 0.2
    );
    seg.rotation.z = (Math.random() - 0.5) * 0.3;
    group.add(seg);
  }

  // Leaves
  const leafMat = new THREE.MeshStandardMaterial({
    color: 0x32CD32, roughness: 0.6,
    emissive: 0x0a3a0a, emissiveIntensity: 0.2
  });
  for (let i = 0; i < 4; i++) {
    const leafGeo = new THREE.PlaneGeometry(0.3, 0.15);
    const leaf = new THREE.Mesh(leafGeo, leafMat);
    leaf.position.set(
      (Math.random() - 0.5) * 0.4,
      Math.random() * height,
      (Math.random() - 0.5) * 0.3
    );
    leaf.rotation.set(Math.random(), Math.random(), Math.random());
    group.add(leaf);
  }

  group.position.set(x, 0, z);
  return group;
}

// ==================== OBSTACLES ====================
function createObstacle(lane, z) {
  const type = Math.random();
  let mesh;

  if (type < 0.5) {
    // Fallen column (low - jump over)
    const group = new THREE.Group();
    const mat = createStoneMaterial(0x7A6B5A);
    const colGeo = new THREE.CylinderGeometry(0.4, 0.45, 2.5, 8);
    const col = new THREE.Mesh(colGeo, mat);
    col.rotation.z = Math.PI / 2;
    col.position.y = 0.45;
    col.castShadow = true;
    group.add(col);

    // Rubble
    for (let i = 0; i < 3; i++) {
      const rubGeo = new THREE.BoxGeometry(0.3, 0.2, 0.3);
      const rub = new THREE.Mesh(rubGeo, mat);
      rub.position.set((Math.random()-0.5)*1.5, 0.1, (Math.random()-0.5)*0.5);
      rub.rotation.y = Math.random() * Math.PI;
      group.add(rub);
    }

    mesh = group;
    mesh.userData.type = 'low';
    mesh.userData.height = 0.9;
  } else {
    // Chest / tall stone (high - dodge)
    const group = new THREE.Group();
    const mat = createStoneMaterial(0x6B5A4A);

    const chestGeo = new THREE.BoxGeometry(1.2, 1.8, 1.0);
    const chest = new THREE.Mesh(chestGeo, mat);
    chest.position.y = 0.9;
    chest.castShadow = true;
    group.add(chest);

    // Lid
    const lidGeo = new THREE.BoxGeometry(1.3, 0.3, 1.1);
    const lidMat = createStoneMaterial(0x5A4A3A);
    const lid = new THREE.Mesh(lidGeo, lidMat);
    lid.position.y = 1.95;
    lid.castShadow = true;
    group.add(lid);

    // Gold trim
    const trimMat = createGoldMaterial();
    const trimGeo = new THREE.BoxGeometry(1.25, 0.08, 1.05);
    const trim = new THREE.Mesh(trimGeo, trimMat);
    trim.position.y = 1.8;
    group.add(trim);

    mesh = group;
    mesh.userData.type = 'high';
    mesh.userData.height = 2.1;
  }

  mesh.position.set(CONFIG.lanes[lane], 0, z);
  mesh.userData.lane = lane;
  mesh.userData.isObstacle = true;
  scene.add(mesh);
  obstacles.push(mesh);
}

// ==================== COINS ====================
function createCoin(lane, z) {
  const group = new THREE.Group();
  const goldMat = createGoldMaterial();

  // Main coin
  const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 16);
  const coin = new THREE.Mesh(coinGeo, goldMat);
  coin.rotation.x = Math.PI / 2;
  group.add(coin);

  // Inner ring
  const ringGeo = new THREE.TorusGeometry(0.2, 0.04, 8, 16);
  const ring = new THREE.Mesh(ringGeo, goldMat);
  group.add(ring);

  // Center gem
  const gemGeo = new THREE.OctahedronGeometry(0.1, 0);
  const gemMat = createRuneMaterial(0x2ecc71);
  const gem = new THREE.Mesh(gemGeo, gemMat);
  group.add(gem);

  group.position.set(CONFIG.lanes[lane], 1.5, z);
  group.userData.isCoin = true;
  group.userData.lane = lane;
  scene.add(group);
  coins.push(group);
}

// ==================== PARTICLES ====================
function spawnParticles(position) {
  const count = 30 + Math.floor(Math.random() * 20);
  for (let i = 0; i < count; i++) {
    const size = 0.08 + Math.random() * 0.15;
    const geo = new THREE.BoxGeometry(size, size, size);
    const colors = [0x9B8B6E, 0x8B7D6B, 0x7A6B5A, 0xA09080, 0x6B5B4E];
    const mat = new THREE.MeshStandardMaterial({
      color: colors[Math.floor(Math.random() * colors.length)],
      roughness: 0.9,
    });
    const particle = new THREE.Mesh(geo, mat);
    particle.position.copy(position);
    particle.position.y += 0.5 + Math.random();

    particle.userData.velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 0.4,
      0.15 + Math.random() * 0.25,
      (Math.random() - 0.5) * 0.4
    );
    particle.userData.life = 1.0;
    particle.userData.decay = 0.01 + Math.random() * 0.02;
    particle.castShadow = false;

    scene.add(particle);
    particles.push(particle);
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.velocity.y -= 0.008; // gravity
    p.position.add(p.userData.velocity);
    p.rotation.x += 0.1;
    p.rotation.z += 0.08;
    p.userData.life -= p.userData.decay;

    const s = Math.max(0, p.userData.life);
    p.scale.set(s, s, s);
    p.material.opacity = s;
    p.material.transparent = true;

    if (p.userData.life <= 0) {
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      particles.splice(i, 1);
    }
  }
}

// ==================== WORLD GENERATION ====================
function generateInitialWorld() {
  for (let i = 0; i < CONFIG.visibleSegments; i++) {
    const z = -i * CONFIG.segmentLength;
    const seg = createRoadSegment(z);
    roadSegments.push(seg);

    if (i > 1) {
      generateDecorations(z);
      if (i > 3 && Math.random() > 0.3) {
        generateObstaclesAndCoins(z);
      }
    }
  }
}

function generateDecorations(z) {
  const halfLen = CONFIG.segmentLength / 2;

  for (let side of [-1, 1]) {
    const baseX = side * (CONFIG.roadWidth / 2 + 3);

    // Columns
    if (Math.random() > 0.3) {
      const col = createColumn(
        baseX + side * (1 + Math.random() * 4),
        z + (Math.random() - 0.5) * CONFIG.segmentLength * 0.8,
        3 + Math.random() * 5
      );
      scene.add(col);
      decorations.push(col);
    }

    // Pyramids (less frequent)
    if (Math.random() > 0.7) {
      const pyr = createPyramid(
        baseX + side * (4 + Math.random() * 6),
        z + (Math.random() - 0.5) * CONFIG.segmentLength,
        2 + Math.random() * 3
      );
      scene.add(pyr);
      decorations.push(pyr);
    }

    // Statues
    if (Math.random() > 0.6) {
      const statue = createStatue(
        baseX + side * (1 + Math.random() * 2),
        z + (Math.random() - 0.5) * CONFIG.segmentLength * 0.6
      );
      scene.add(statue);
      decorations.push(statue);
    }

    // Torches
    if (Math.random() > 0.4) {
      const torch = createTorch(
        side * (CONFIG.roadWidth / 2 + 0.8),
        z + (Math.random() - 0.5) * CONFIG.segmentLength * 0.5
      );
      scene.add(torch);
      decorations.push(torch);
      torches.push(torch);
    }

    // Vines
    if (Math.random() > 0.3) {
      const vine = createVine(
        baseX + side * Math.random() * 3,
        z + (Math.random() - 0.5) * CONFIG.segmentLength,
        2 + Math.random() * 4
      );
      scene.add(vine);
      decorations.push(vine);
    }
  }
}

function generateObstaclesAndCoins(z) {
  // Obstacles
  const numObs = Math.random() > 0.5 ? 2 : 1;
  const usedLanes = new Set();
  for (let i = 0; i < numObs; i++) {
    let lane;
    do { lane = Math.floor(Math.random() * 3); } while (usedLanes.has(lane));
    usedLanes.add(lane);
    createObstacle(lane, z + (Math.random() - 0.5) * 5);
  }

  // Coins in free lanes
  for (let lane = 0; lane < 3; lane++) {
    if (!usedLanes.has(lane) && Math.random() > 0.3) {
      const numCoins = 2 + Math.floor(Math.random() * 3);
      for (let c = 0; c < numCoins; c++) {
        createCoin(lane, z - c * 2.5 + (Math.random() - 0.5));
      }
    }
  }
}

// ==================== RECYCLING ====================
function recycleWorld() {
  const playerZ = player.position.z;

  // Recycle road segments
  for (let i = 0; i < roadSegments.length; i++) {
    const seg = roadSegments[i];
    if (seg.position.z > playerZ + CONFIG.segmentLength * 2) {
      // Find the furthest back segment
      let minZ = Infinity;
      let minIdx = 0;
      for (let j = 0; j < roadSegments.length; j++) {
        if (roadSegments[j].position.z < minZ) {
          minZ = roadSegments[j].position.z;
          minIdx = j;
        }
      }
      seg.position.z = minZ - CONFIG.segmentLength;
      generateDecorations(seg.position.z);
      generateObstaclesAndCoins(seg.position.z);
    }
  }

  // Clean up far behind objects
  for (let i = obstacles.length - 1; i >= 0; i--) {
    if (obstacles[i].position.z > playerZ + 20) {
      scene.remove(obstacles[i]);
      obstacles.splice(i, 1);
    }
  }

  for (let i = coins.length - 1; i >= 0; i--) {
    if (coins[i].position.z > playerZ + 20) {
      scene.remove(coins[i]);
      coins.splice(i, 1);
    }
  }

  for (let i = decorations.length - 1; i >= 0; i--) {
    if (decorations[i].position.z > playerZ + 30) {
      scene.remove(decorations[i]);
      decorations.splice(i, 1);
    }
  }

  for (let i = torches.length - 1; i >= 0; i--) {
    if (torches[i].position.z > playerZ + 30) {
      torches.splice(i, 1);
    }
  }
}

// ==================== COLLISION ====================
function checkCollisions() {
  const px = player.position.x;
  const pz = player.position.z;
  const py = player.position.y;

  // Obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    const dx = Math.abs(px - obs.position.x);
    const dz = Math.abs(pz - obs.position.z);

    if (dx < 1.0 && dz < 1.2) {
      if (obs.userData.type === 'low') {
        if (py < obs.userData.height * 0.7) {
          triggerGameOver(obs.position);
          return;
        }
      } else {
        if (py < obs.userData.height * 0.6) {
          triggerGameOver(obs.position);
          return;
        }
      }
    }
  }

  // Coins
  for (let i = coins.length - 1; i >= 0; i--) {
    const coin = coins[i];
    const dx = Math.abs(px - coin.position.x);
    const dz = Math.abs(pz - coin.position.z);
    const dy = Math.abs((py + 1.5) - coin.position.y);

    if (dx < 1.0 && dz < 1.0 && dy < 1.5) {
      coinCount++;
      score += CONFIG.coinValue;
      document.getElementById('coins').textContent = coinCount;
      document.getElementById('score').textContent = score;
      scene.remove(coin);
      coins.splice(i, 1);
    }
  }
}

// ==================== GAME STATE ====================
function triggerGameOver(pos) {
  gameRunning = false;
  gameOver = true;
  spawnParticles(pos);
  document.getElementById('final-score').textContent = '🏛 ' + score;
  document.getElementById('final-coins').textContent = '🪙 ' + coinCount;
  setTimeout(() => {
    document.getElementById('gameover-screen').style.display = 'flex';
  }, 500);
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  gameRunning = true;
  gameOver = false;
}

function restartGame() {
  document.getElementById('gameover-screen').style.display = 'none';

  // Clean everything
  obstacles.forEach(o => scene.remove(o));
  coins.forEach(c => scene.remove(c));
  decorations.forEach(d => scene.remove(d));
  particles.forEach(p => { scene.remove(p); p.geometry.dispose(); p.material.dispose(); });
  roadSegments.forEach(s => scene.remove(s));

  obstacles = [];
  coins = [];
  decorations = [];
  particles = [];
  torches = [];
  roadSegments = [];

  playerLane = 1;
  targetX = CONFIG.lanes[1];
  player.position.set(targetX, 0, 0);
  isJumping = false;
  jumpVelocity = 0;
  gameSpeed = CONFIG.baseSpeed;
  score = 0;
  coinCount = 0;
  frameCount = 0;

  document.getElementById('score').textContent = '0';
  document.getElementById('coins').textContent = '0';
  document.getElementById('speed').textContent = '1.0';

  generateInitialWorld();
  gameRunning = true;
  gameOver = false;
}

// ==================== CONTROLS ====================
function setupControls() {
  document.addEventListener('keydown', (e) => {
    if (!gameRunning) return;
    switch(e.code) {
      case 'ArrowLeft': case 'KeyA': moveLeft(); break;
      case 'ArrowRight': case 'KeyD': moveRight(); break;
      case 'ArrowUp': case 'KeyW': case 'Space': jump(); e.preventDefault(); break;
    }
  });

  // Touch/swipe
  let touchStartX = 0, touchStartY = 0;
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  });
  document.addEventListener('touchend', (e) => {
    if (!gameRunning) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
      if (dx > 0) moveRight(); else moveLeft();
    } else if (dy < -30) {
      jump();
    }
  });
}

function moveLeft() {
  if (!gameRunning || playerLane <= 0) return;
  playerLane--;
  targetX = CONFIG.lanes[playerLane];
}

function moveRight() {
  if (!gameRunning || playerLane >= 2) return;
  playerLane++;
  targetX = CONFIG.lanes[playerLane];
}

function jump() {
  if (!gameRunning || isJumping) return;
  isJumping = true;
  jumpVelocity = CONFIG.jumpForce;
}

// ==================== ANIMATION ====================
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  frameCount++;

  if (gameRunning) {
    // Speed increase
    gameSpeed += CONFIG.speedIncrement;
    const speedMult = gameSpeed / CONFIG.baseSpeed;
    document.getElementById('speed').textContent = speedMult.toFixed(1);

    // Move player forward (actually move world backward)
    const moveAmount = gameSpeed;

    // Move road segments
    roadSegments.forEach(seg => {
      seg.position.z += moveAmount;
    });

    // Move obstacles
    obstacles.forEach(obs => {
      obs.position.z += moveAmount;
    });

    // Move coins
    coins.forEach(coin => {
      coin.position.z += moveAmount;
      coin.rotation.y += 0.05;
      coin.position.y = 1.5 + Math.sin(frameCount * 0.05 + coin.position.x) * 0.2;
    });

    // Move decorations
    decorations.forEach(dec => {
      dec.position.z += moveAmount;
    });

    // Score
    score += Math.floor(gameSpeed * 2);
    document.getElementById('score').textContent = score;

    // Lane switching (smooth)
    player.position.x += (targetX - player.position.x) * 0.15;

    // Jump physics
    if (isJumping) {
      jumpVelocity -= CONFIG.gravity;
      player.position.y += jumpVelocity;
      if (player.position.y <= 0) {
        player.position.y = 0;
        isJumping = false;
        jumpVelocity = 0;
      }
    }

    // Player bob
    if (!isJumping) {
      player.position.y = Math.sin(frameCount * 0.15) * 0.05;
    }

    // Player lean
    const leanTarget = (targetX - player.position.x) * 0.3;
    player.rotation.z += (leanTarget - player.rotation.z) * 0.1;

    // Collisions
    checkCollisions();

    // Recycle
    if (frameCount % 30 === 0) {
      recycleWorld();
    }
  }

  // Animate torches
  torches.forEach(torch => {
    if (torch.userData.fireLight) {
      torch.userData.fireLight.intensity = 1.2 + Math.sin(frameCount * 0.2 + torch.position.x) * 0.5;
    }
    if (torch.userData.fireMesh) {
      const s = 0.9 + Math.sin(frameCount * 0.3 + torch.position.z) * 0.2;
      torch.userData.fireMesh.scale.set(s, 1.1 + Math.sin(frameCount * 0.25) * 0.3, s);
    }
  });

  // Update particles
  updateParticles();

  // Camera follow
  camera.position.x += (player.position.x * 0.3 - camera.position.x) * 0.05;
  camera.position.y = 6 + player.position.y * 0.3;

  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ==================== START ====================
init();
</script>

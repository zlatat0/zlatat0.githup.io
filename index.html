<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>🐕 Lunar Doggo — Космический Платформер</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: radial-gradient(ellipse at center, #0a0e27 0%, #000 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', sans-serif;
        color: #e0e0e0;
        overflow: hidden;
    }
    h1 {
        color: #60a5fa;
        text-shadow: 0 0 20px rgba(96, 165, 250, 0.6);
        margin-bottom: 10px;
        font-size: 2em;
    }
    .hint {
        color: #94a3b8;
        margin-bottom: 15px;
        font-size: 0.9em;
    }
    #game {
        border: 2px solid #4a5568;
        border-radius: 12px;
        box-shadow: 0 0 40px rgba(96, 165, 250, 0.3);
        background: #000;
        display: block;
        outline: none;
    }
    .info {
        margin-top: 15px;
        color: #64748b;
        font-size: 0.85em;
        text-align: center;
    }
</style>
</head>
<body>
    <h1>🐕 LUNAR DOGGO 🌙</h1>
    <div class="hint">Стрелки / A D — движение, Пробел / W / ↑ — прыжок</div>
    <canvas id="game" width="900" height="520" tabindex="0"></canvas>
    <div class="info">Собери 25 ⭐ звёздочек и нажми кнопку "Следующий уровень"!</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
canvas.focus(); // фокус на canvas для клавиш

const STATE = { MENU: 0, TUTORIAL: 1, PLAYING: 2, DEAD: 3, LEVEL_COMPLETE: 4 };
let gameState = STATE.MENU;

const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
    }
    if (gameState === STATE.MENU && e.code === 'Space') startGame(true);
    else if (gameState === STATE.DEAD && e.code === 'Space') restartFromStart();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('click', e => {
    canvas.focus();
    if (gameState === STATE.MENU) { startGame(true); return; }
    if (gameState === STATE.DEAD) { restartFromStart(); return; }
    if (gameState === STATE.LEVEL_COMPLETE) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (W / rect.width);
        const y = (e.clientY - rect.top) * (H / rect.height);
        if (x > W/2 - 100 && x < W/2 + 100 && y > H/2 + 80 && y < H/2 + 130) {
            nextLevel();
        }
    }
});

const PHYS = {
    gravity: 0.45,
    moveSpeed: 4.5,
    jumpPower: -11,
    coyoteTime: 8,
    jumpBuffer: 8
};

const player = {
    x: 100, y: 300, w: 42, h: 48,
    vx: 0, vy: 0,
    onGround: false,
    coyote: 0,
    jumpBuffer: 0,
    facing: 1,
    animFrame: 0,
    animTimer: 0,
    state: 'idle',
    _jumpHeld: false
};

let cameraX = 0;
let level = { chunks: [], length: 0, number: 1 };
let stars = [];
let enemies = [];
let particles = [];
let score = 0;
let lives = 3;
let starsCollected = 0;
const STARS_NEEDED = 25;
let bestScore = parseInt(localStorage.getItem('lunarDoggoBest') || '0');

const bgStars = [];
for (let i = 0; i < 150; i++) {
    bgStars.push({
        x: Math.random() * W * 3,
        y: Math.random() * H * 0.7,
        r: Math.random() * 1.5 + 0.3,
        twinkle: Math.random() * Math.PI * 2
    });
}

function generateLevel(number) {
    level.chunks = [];
    stars = [];
    enemies = [];
    particles = [];
    starsCollected = 0;

    const chunkCount = 15 + Math.min(number * 2, 30);
    const difficulty = Math.min(number / 10, 1);

    level.chunks.push({ type: 'tutorial', x: 0, w: 500, groundY: H - 80 });

    let currentX = 500;
    let lastType = 'tutorial';

    for (let i = 0; i < chunkCount; i++) {
        const chunk = pickChunk(lastType, difficulty, currentX);
        level.chunks.push(chunk);
        currentX += chunk.w;
        lastType = chunk.type;

        const starCount = 2 + Math.floor(Math.random() * 3);
        for (let s = 0; s < starCount; s++) {
            stars.push({
                x: chunk.x + 50 + Math.random() * (chunk.w - 100),
                y: chunk.groundY - 80 - Math.random() * 60,
                collected: false,
                angle: Math.random() * Math.PI * 2
            });
        }

        if (chunk.type !== 'tutorial' && Math.random() < 0.3 + difficulty * 0.4) {
            enemies.push(createRocket(chunk.x + chunk.w / 2, chunk.groundY - 150, difficulty));
        }
    }

    level.length = currentX;
}

function pickChunk(lastType, difficulty, startX) {
    const types = ['flat', 'gap', 'steps', 'enemy'];
    let weights;
    if (lastType === 'gap') {
        weights = { flat: 10, gap: 0, steps: 2, enemy: 0 };
    } else if (lastType === 'enemy') {
        weights = { flat: 8, gap: 2, steps: 2, enemy: 0 };
    } else {
        weights = {
            flat: 5 - difficulty * 3,
            gap: 3 + difficulty * 4,
            steps: 2 + difficulty * 2,
            enemy: difficulty * 5
        };
    }

    const total = Object.values(weights).reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    let type = 'flat';
    for (const t of types) {
        r -= weights[t];
        if (r <= 0) { type = t; break; }
    }

    return { type, x: startX, w: 250 + Math.random() * 200, groundY: H - 80 };
}

function createRocket(x, y, difficulty) {
    return {
        x, y, w: 30, h: 50,
        baseX: x, baseY: y,
        vx: (1.5 + difficulty * 2) * (Math.random() < 0.5 ? -1 : 1),
        range: 120 + Math.random() * 80,
        flame: 0,
        type: Math.random() < 0.5 ? 'horizontal' : 'vertical'
    };
}

function startGame(isTutorial) {
    gameState = isTutorial ? STATE.TUTORIAL : STATE.PLAYING;
    score = 0;
    lives = 3;
    level.number = 1;
    generateLevel(level.number);
    resetPlayer();
}

function restartFromStart() {
    score = 0;
    lives = 3;
    level.number = 1;
    generateLevel(level.number);
    resetPlayer();
    gameState = STATE.PLAYING;
}

function nextLevel() {
    level.number++;
    generateLevel(level.number);
    resetPlayer();
    gameState = STATE.PLAYING;
}

function resetPlayer() {
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.onGround = false;
    player.coyote = 0;
    player.jumpBuffer = 0;
    cameraX = 0;
}

function loseLife() {
    lives--;
    for (let i = 0; i < 30; i++) {
        particles.push({
            x: player.x + player.w / 2,
            y: player.y + player.h / 2,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 40,
            color: Math.random() < 0.5 ? '#ff6b6b' : '#fbbf24',
            size: Math.random() * 4 + 2
        });
    }
    if (lives <= 0) {
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('lunarDoggoBest', bestScore);
        }
        gameState = STATE.DEAD;
    } else {
        resetPlayer();
    }
}

function update() {
    if (gameState !== STATE.PLAYING && gameState !== STATE.TUTORIAL) return;

    const left = keys['ArrowLeft'] || keys['KeyA'];
    const right = keys['ArrowRight'] || keys['KeyD'];
    const jumpPressed = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];

    if (left) { player.vx = -PHYS.moveSpeed; player.facing = -1; }
    else if (right) { player.vx = PHYS.moveSpeed; player.facing = 1; }
    else { player.vx *= 0.8; if (Math.abs(player.vx) < 0.1) player.vx = 0; }

    // Буфер прыжка: запоминаем нажатие
    if (jumpPressed && !player._jumpHeld) {
        player.jumpBuffer = PHYS.jumpBuffer;
    }
    player._jumpHeld = jumpPressed;

    // ⭐ ИСПРАВЛЕНИЕ: если на земле — обновляем coyote каждый кадр
    if (player.onGround) {
        player.coyote = PHYS.coyoteTime;
    }

    // Прыжок срабатывает, если есть буфер И (на земле ИЛИ в coyote time)
    if (player.jumpBuffer > 0 && player.coyote > 0) {
        player.vy = PHYS.jumpPower;
        player.onGround = false;
        player.coyote = 0;
        player.jumpBuffer = 0;
        spawnDust(player.x + player.w / 2, player.y + player.h, 8);
    }

    // Variable jump height
    if (!jumpPressed && player.vy < -4) player.vy = -4;

    if (player.jumpBuffer > 0) player.jumpBuffer--;
    if (player.coyote > 0 && !player.onGround) player.coyote--;

    player.vy += PHYS.gravity;
    if (player.vy > 15) player.vy = 15;

    player.x += player.vx;
    resolveCollisionX();
    player.y += player.vy;
    const wasOnGround = player.onGround;
    player.onGround = false;
    resolveCollisionY();

    if (!wasOnGround && player.onGround) {
        spawnDust(player.x + player.w / 2, player.y + player.h, 6);
    }

    if (player.y > H + 100) loseLife();

    player.animTimer++;
    if (player.animTimer > 6) {
        player.animTimer = 0;
        player.animFrame = (player.animFrame + 1) % 4;
    }
    if (!player.onGround) player.state = player.vy < 0 ? 'jump' : 'fall';
    else if (Math.abs(player.vx) > 0.5) player.state = 'run';
    else player.state = 'idle';

    const targetCam = player.x - W / 3;
    cameraX += (targetCam - cameraX) * 0.1;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > level.length - W) cameraX = level.length - W;

    for (const s of stars) {
        if (s.collected) continue;
        s.angle += 0.05;
        if (Math.abs(s.x - (player.x + player.w / 2)) < 25 &&
            Math.abs(s.y - (player.y + player.h / 2)) < 25) {
            s.collected = true;
            starsCollected++;
            score += 10;
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: s.x, y: s.y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 25,
                    color: '#fbbf24',
                    size: Math.random() * 3 + 1
                });
            }
            if (starsCollected >= STARS_NEEDED) {
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('lunarDoggoBest', bestScore);
                }
                gameState = STATE.LEVEL_COMPLETE;
            }
        }
    }

    for (const e of enemies) {
        e.flame += 0.3;
        if (e.type === 'horizontal') {
            e.x += e.vx;
            if (Math.abs(e.x - e.baseX) > e.range) e.vx *= -1;
        } else {
            e.y += Math.sin(e.flame * 0.1) * 1.5;
        }
        if (rectsOverlap(player, e)) {
            loseLife();
            return;
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.vx *= 0.98;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (gameState === STATE.TUTORIAL && player.x > 450) {
        gameState = STATE.PLAYING;
    }
}

function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
}

function resolveCollisionX() {
    for (const c of level.chunks) {
        if (c.type === 'gap') continue;
        const gY = c.groundY;
        if (player.x + player.w > c.x && player.x < c.x + c.w &&
            player.y + player.h > gY && player.y < H) {
            if (player.vx > 0) player.x = c.x - player.w;
            else if (player.vx < 0) player.x = c.x + c.w;
            player.vx = 0;
        }
    }
}

function resolveCollisionY() {
    for (const c of level.chunks) {
        if (c.type === 'gap') continue;
        const gY = c.groundY;
        if (player.x + player.w > c.x && player.x < c.x + c.w) {
            if (player.y + player.h > gY && player.y + player.h < gY + 30 && player.vy >= 0) {
                player.y = gY - player.h;
                player.vy = 0;
                player.onGround = true;
            }
        }
    }
}

function spawnDust(x, y, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 3,
            vy: -Math.random() * 2,
            life: 20 + Math.random() * 10,
            color: '#9ca3af',
            size: Math.random() * 2 + 1
        });
    }
}

function render() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#050816');
    grad.addColorStop(0.6, '#0a0e27');
    grad.addColorStop(1, '#1a1f3a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    for (const s of bgStars) {
        const sx = (s.x - cameraX * 0.1) % (W * 3);
        const alpha = 0.5 + Math.sin(s.twinkle + performance.now() * 0.002) * 0.4;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(sx < 0 ? sx + W * 3 : sx, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }

    drawEarth(W * 0.8 - cameraX * 0.05, 80, 40);
    drawMountains(cameraX * 0.3, '#1e293b', 0.6, H - 180, 80);
    drawMountains(cameraX * 0.6, '#334155', 0.8, H - 140, 60);
    drawMountains(cameraX * 0.9, '#475569', 1.0, H - 100, 40);

    ctx.save();
    ctx.translate(-cameraX, 0);

    for (const c of level.chunks) {
        if (c.type === 'gap') continue;
        drawLunarGround(c.x, c.groundY, c.w, H - c.groundY);
    }

    for (const s of stars) {
        if (s.collected) continue;
        drawStar(s.x, s.y, 10, s.angle);
    }

    for (const e of enemies) drawRocket(e);

    for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 40;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawDoggo(player);

    ctx.restore();

    drawUI();

    if (gameState === STATE.MENU) drawMenu();
    else if (gameState === STATE.TUTORIAL) drawTutorialHint();
    else if (gameState === STATE.DEAD) drawGameOver();
    else if (gameState === STATE.LEVEL_COMPLETE) drawLevelComplete();
}

function drawEarth(x, y, r) {
    const g = ctx.createRadialGradient(x - r/3, y - r/3, r/5, x, y, r);
    g.addColorStop(0, '#60a5fa');
    g.addColorStop(0.5, '#2563eb');
    g.addColorStop(1, '#1e3a8a');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(96, 165, 250, 0.15)';
    ctx.beginPath();
    ctx.arc(x, y, r * 1.4, 0, Math.PI * 2);
    ctx.fill();
}

function drawMountains(offset, color, alpha, baseY, amplitude) {
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) {
        const wx = x + offset;
        const y = baseY - Math.abs(Math.sin(wx * 0.01) * amplitude) - Math.abs(Math.sin(wx * 0.003) * amplitude * 0.5);
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
}

function drawLunarGround(x, y, w, h) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#6b7280');
    g.addColorStop(0.3, '#4b5563');
    g.addColorStop(1, '#1f2937');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#9ca3af';
    ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = 'rgba(31, 41, 55, 0.5)';
    for (let i = 0; i < w; i += 60) {
        const cx = x + i + 30;
        const cy = y + 20 + (i % 40);
        ctx.beginPath();
        ctx.ellipse(cx, cy, 12, 4, 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawStar(x, y, r, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2);
    glow.addColorStop(0, 'rgba(251, 191, 36, 0.6)');
    glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(-r * 2, -r * 2, r * 4, r * 4);
    ctx.fillStyle = '#fbbf24';
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        const a = (Math.PI * 2 * i) / 10 - Math.PI / 2;
        const rr = i % 2 === 0 ? r : r / 2.5;
        const px = Math.cos(a) * rr;
        const py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function drawRocket(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.vx < 0) ctx.scale(-1, 1);

    const flameSize = 10 + Math.sin(e.flame) * 5;
    const flameGrad = ctx.createLinearGradient(0, e.h/2, 0, e.h/2 + flameSize + 15);
    flameGrad.addColorStop(0, '#fef3c7');
    flameGrad.addColorStop(0.4, '#fbbf24');
    flameGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.moveTo(-8, e.h/2);
    ctx.lineTo(8, e.h/2);
    ctx.lineTo(0, e.h/2 + flameSize + 15);
    ctx.closePath();
    ctx.fill();

    const bodyGrad = ctx.createLinearGradient(-e.w/2, 0, e.w/2, 0);
    bodyGrad.addColorStop(0, '#9ca3af');
    bodyGrad.addColorStop(0.5, '#f3f4f6');
    bodyGrad.addColorStop(1, '#6b7280');
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(-e.w/2, -e.h/2 + 10, e.w, e.h - 10);

    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.moveTo(-e.w/2, -e.h/2 + 10);
    ctx.lineTo(0, -e.h/2 - 5);
    ctx.lineTo(e.w/2, -e.h/2 + 10);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#dc2626';
    ctx.fillRect(-e.w/2, 0, e.w, 5);

    ctx.fillStyle = '#60a5fa';
    ctx.strokeStyle = '#1e40af';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -5, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.moveTo(-e.w/2, e.h/2);
    ctx.lineTo(-e.w/2 - 8, e.h/2 + 5);
    ctx.lineTo(-e.w/2, e.h/2 - 10);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(e.w/2, e.h/2);
    ctx.lineTo(e.w/2 + 8, e.h/2 + 5);
    ctx.lineTo(e.w/2, e.h/2 - 10);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawDoggo(p) {
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    if (p.facing < 0) ctx.scale(-1, 1);

    let bob = 0;
    if (p.state === 'run') bob = Math.sin(p.animFrame * Math.PI / 2) * 2;

    ctx.strokeStyle = '#a16207';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const tailWag = Math.sin(performance.now() * 0.01) * 0.3;
    ctx.moveTo(-12, 5 + bob);
    ctx.quadraticCurveTo(-22, -5 + bob + tailWag * 10, -18, -15 + bob);
    ctx.stroke();

    ctx.fillStyle = '#78350f';
    const legOffset = p.state === 'run' ? Math.sin(p.animFrame * Math.PI / 2) * 3 : 0;
    ctx.fillRect(-10, 15 + bob, 6, 8 - legOffset);
    ctx.fillRect(4, 15 + bob, 6, 8 + legOffset);

    const suitGrad = ctx.createLinearGradient(0, -10, 0, 20);
    suitGrad.addColorStop(0, '#f9fafb');
    suitGrad.addColorStop(1, '#d1d5db');
    ctx.fillStyle = suitGrad;
    ctx.beginPath();
    ctx.ellipse(0, 5 + bob, 16, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#6b7280';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(6, 5 + bob, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(-8, 10 + bob, 4, 4);

    ctx.fillStyle = '#d97706';
    ctx.beginPath();
    ctx.arc(2, -10 + bob, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.ellipse(6, -6 + bob, 8, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#92400e';
    ctx.beginPath();
    ctx.moveTo(-6, -18 + bob);
    ctx.lineTo(-12, -25 + bob);
    ctx.lineTo(-2, -20 + bob);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8, -18 + bob);
    ctx.lineTo(14, -25 + bob);
    ctx.lineTo(4, -20 + bob);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#1f2937';
    ctx.beginPath();
    ctx.arc(-1, -12 + bob, 2.5, 0, Math.PI * 2);
    ctx.arc(7, -12 + bob, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -13 + bob, 0.8, 0, Math.PI * 2);
    ctx.arc(8, -13 + bob, 0.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#1f2937';
    ctx.beginPath();
    ctx.ellipse(11, -6 + bob, 2.5, 2, 0, 0, Math.PI * 2);
    ctx.fill();

    if (p.state === 'jump') {
        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.ellipse(10, -2 + bob, 2, 3, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.strokeStyle = 'rgba(148, 163, 184, 0.9)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(2, -10 + bob, 16, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(186, 230, 253, 0.25)';
    ctx.beginPath();
    ctx.arc(2, -10 + bob, 15, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.beginPath();
    ctx.ellipse(-5, -18 + bob, 4, 2, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawUI() {
    for (let i = 0; i < 3; i++) {
        drawHeart(25 + i * 35, 30, i < lives ? '#ef4444' : '#374151');
    }

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 22px Segoe UI';
    ctx.textAlign = 'left';
    ctx.fillText('⭐ ' + score, 140, 37);

    ctx.fillStyle = '#60a5fa';
    ctx.fillText('Уровень ' + level.number, W - 150, 37);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px Segoe UI';
    ctx.textAlign = 'right';
    ctx.fillText('Рекорд: ' + bestScore, W - 20, 60);

    ctx.fillStyle = '#22c55e';
    ctx.font = 'bold 18px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(`⭐ ${starsCollected} / ${STARS_NEEDED}`, W / 2, 30);
    
    const barWidth = 200;
    const progress = Math.min(1, starsCollected / STARS_NEEDED);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(W / 2 - barWidth / 2, 40, barWidth, 10);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(W / 2 - barWidth / 2, 40, barWidth * progress, 10);
    ctx.strokeStyle = '#4a5568';
    ctx.strokeRect(W / 2 - barWidth / 2, 40, barWidth, 10);
}

function drawHeart(x, y, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + 5);
    ctx.bezierCurveTo(x, y, x - 10, y, x - 10, y + 7);
    ctx.bezierCurveTo(x - 10, y + 14, x, y + 18, x, y + 20);
    ctx.bezierCurveTo(x, y + 18, x + 10, y + 14, x + 10, y + 7);
    ctx.bezierCurveTo(x + 10, y, x, y, x, y + 5);
    ctx.fill();
}

function drawMenu() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#60a5fa';
    ctx.font = 'bold 54px Segoe UI';
    ctx.fillText('🐕 LUNAR DOGGO 🌙', W/2, H/2 - 60);

    ctx.fillStyle = '#e0e0e0';
    ctx.font = '20px Segoe UI';
    ctx.fillText('Космическое приключение собаки в скафандре', W/2, H/2 - 15);

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 24px Segoe UI';
    const pulse = 0.8 + Math.sin(performance.now() * 0.005) * 0.2;
    ctx.globalAlpha = pulse;
    ctx.fillText('Нажми ПРОБЕЛ или кликни чтобы начать', W/2, H/2 + 50);
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#94a3b8';
    ctx.font = '16px Segoe UI';
    ctx.fillText('Собери 25 ⭐ звёздочек и переходи на следующий уровень!', W/2, H/2 + 100);
}

function drawTutorialHint() {
    if (player.x < 400) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(W/2 - 220, H - 90, 440, 50);
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 18px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('← → или A D — бежать · ПРОБЕЛ — прыгать', W/2, H - 60);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ef4444';
    ctx.font = 'bold 60px Segoe UI';
    ctx.fillText('GAME OVER', W/2, H/2 - 40);

    ctx.fillStyle = '#e0e0e0';
    ctx.font = '24px Segoe UI';
    ctx.fillText('Очки: ' + score + '   ·   Рекорд: ' + bestScore, W/2, H/2 + 10);

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 20px Segoe UI';
    ctx.fillText('Нажми ПРОБЕЛ или кликни чтобы начать заново', W/2, H/2 + 60);
}

function drawLevelComplete() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#22c55e';
    ctx.font = 'bold 48px Segoe UI';
    ctx.fillText('✨ УРОВЕНЬ ' + level.number + ' ПРОЙДЕН! ✨', W/2, H/2 - 40);

    ctx.fillStyle = '#fbbf24';
    ctx.font = '28px Segoe UI';
    ctx.fillText('⭐ Собрано: ' + starsCollected + '   ·   Очки: ' + score, W/2, H/2 + 10);

    const btnX = W/2 - 100;
    const btnY = H/2 + 80;
    const btnW = 200;
    const btnH = 50;
    
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(btnX + 3, btnY + 3, btnW, btnH);
    
    const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
    btnGrad.addColorStop(0, '#60a5fa');
    btnGrad.addColorStop(1, '#3b82f6');
    ctx.fillStyle = btnGrad;
    ctx.fillRect(btnX, btnY, btnW, btnH);
    
    ctx.strokeStyle = '#93c5fd';
    ctx.lineWidth = 2;
    ctx.strokeRect(btnX, btnY, btnW, btnH);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Segoe UI';
    ctx.fillText('Следующий уровень →', W/2, btnY + 32);
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

generateLevel(1);
loop();
</script>
</body>
</html>
